<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starchart - Planet Hopper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">

</head>

<body class="bg-dark">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Planet Hopper</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventory.html">Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="wellness.html">Challenges</a></li>
                    <li class="nav-item"><a class="nav-link" href="customize.html">Suit</a></li>
                    <li class="nav-item mx-2"><a class="btn btn-primary btn-sm px-4" href="planets.html">Play
                            Mission</a></li>
                    <li class="nav-item"><a class="nav-link text-danger ms-lg-3" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-2 text-center animate-fade">
        <h2 class="display-5 fw-bold mb-1">Planet Directory</h2>
        <p class="text-muted">Select an unlocked planet to begin your mission</p>

        <div id="alertPlaceholder"></div>

        <div class="starchart-bg p-5 my-5 rounded-5 overflow-hidden border border-white border-opacity-10">
            <div id="planetsContainer" class="planet-orbit row justify-content-center g-5">
                <div class="col-12 text-center text-muted"></div>
            </div>
        </div>
    </div>

    <!-- STATS DETAIL TEMPLATE -->
    <div id="statsBackdrop" class="stats-backdrop">
        <div id="statsBox" class="planet-stats-box glass-panel p-5 animate-fade">
            <div class="text-end mb-3">
                <button class="btn btn-close btn-close-white" id="closeStats"></button>
            </div>
            <div id="statsContent">
            </div>
            <div class="mt-4 text-center d-flex gap-2 justify-content-center">
                <button id="leaderboardBtn" class="btn btn-outline-light px-4 py-3">Leaderboard</button>
                <a href="#" id="missionLaunchBtn" class="btn btn-primary px-5 py-3">Initiate Launch</a>
            </div>
        </div>
    </div>

    <!-- LEADERBOARD MODAL -->
    <div class="modal fade" id="leaderboardModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-panel border-0 text-white">
                <div class="modal-header border-bottom border-white border-opacity-10">
                    <h2 class="modal-title h5">Planet Leaderboard</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="leaderboardList" class="list-group list-group-flush bg-transparent">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/planets.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
