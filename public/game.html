<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Mission - Planet Hopper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body class="game-body">

    <div class="hud-overlay"></div>

    <!-- HUD HEADER -->
    <div class="container-fluid py-3 px-4 position-relative z-10 hud-panel">
        <div class="row align-items-center">
            <div class="col-4">
                <div class="glass-panel px-3 py-2 d-inline-block">
                    <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Status</small>
                    <span id="planetName" class="fw-bold text-accent">Orbital Descent...</span>
                </div>
            </div>
            <div class="col-4 text-center">
                <div id="dangerWarning" class="danger-alert fw-bold fs-4 text-uppercase">
                    <i class="bi bi-exclamation-triangle-fill"></i> Collision Imminent
                </div>
            </div>
            <div class="col-4 text-end">
                <div class="glass-panel px-3 py-2 d-inline-block">
                    <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Mission
                        Time</small>
                    <span id="timeDisplay" class="fw-bold fs-4">0</span><span class="text-muted ms-1">s</span>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME VIEWPORT -->
    <div class="position-absolute top-0 start-0 w-100 h-100">
        <div id="startMessage" class="text-center position-absolute w-100 z-10" style="top: 40%;">
            <p class="display-6 fw-bold text-white mb-2">Systems Ready</p>
            <p class="text-accent animate-pulse">Press [SPACE] or Tap to Launch</p>
        </div>
        <canvas id="gameCanvas" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

    <!-- MOBILE CONTROLS -->
    <div id="mobileControls" class="position-fixed top-0 end-0 h-100 p-3 d-none flex-column z-20"
        style="z-index: 2000; width: 120px; pointer-events: none;">

        <!-- Jump Area (Upper Half) -->
        <div class="flex-grow-1 d-flex align-items-center justify-content-center" style="pointer-events: auto;">
            <button id="jumpBtn" class="btn btn-primary rounded-circle shadow border-4 border-white opacity-75"
                style="width: 100px; height: 100px;">
                <i class="bi bi-arrow-up display-4"></i>
            </button>
        </div>

        <!-- Duck Area (Lower Half) -->
        <div class="flex-grow-1 d-flex align-items-center justify-content-center" style="pointer-events: auto;">
            <button id="duckBtn" class="btn btn-secondary rounded-circle shadow opacity-75 border-0"
                style="width: 100px; height: 100px;">
                <i class="bi bi-arrow-down display-4"></i>
            </button>
        </div>
    </div>

    <!-- HUD FOOTER -->
    <div class="fixed-bottom p-4 hud-panel">
        <div class="container">
            <div class="row align-items-end">
                <div class="col-4">
                    <button id="abandonBtn" class="btn btn-outline-danger btn-sm px-4">Leave</button>
                    <button id="toggleControlsBtn" class="btn btn-outline-light btn-sm ms-2">Mobile HUD</button>
                </div>
                <div class="col-4 text-center">
                    <div class="d-flex justify-content-center gap-2 mb-2">
                        <button id="consumable1" class="btn btn-outline-primary consumable-btn" disabled>--</button>
                        <button id="consumable2" class="btn btn-outline-primary consumable-btn" disabled>--</button>
                        <button id="consumable3" class="btn btn-outline-primary consumable-btn" disabled>--</button>
                        <button id="consumable4" class="btn btn-outline-primary consumable-btn" disabled>--</button>
                    </div>
                    <small class="text-muted small">Hotkeys: [1] [2] [3] [4]</small>
                </div>
                <div class="col-4">
                </div>
            </div>
        </div>
    </div>

    <!-- END GAME SCREENS -->
    <div id="victoryScreen"
        class="position-fixed top-0 start-0 w-100 h-100 bg-black bg-opacity-90 d-none flex-column align-items-center justify-content-center z-100 animate-fade"
        style="z-index: 1000 !important;">
        <div class="glass-panel p-5 text-center">
            <h1 class="display-3 fw-bold text-success mb-3">Mission Successful</h1>
            <p class="lead text-muted mb-4" id="unlockMessage">Orbit Stabilized.</p>
            <button id="backToPlanetsBtn" class="btn btn-primary px-5 py-3">Return to Directory</button>
        </div>
    </div>

    <div id="gameOverScreen"
        class="position-fixed top-0 start-0 w-100 h-100 bg-black bg-opacity-90 d-none flex-column align-items-center justify-content-center z-100 animate-fade"
        style="z-index: 1000 !important;">
        <div class="glass-panel p-5 text-center">
            <h1 class="display-3 fw-bold text-danger mb-3">Level Failed</h1>
            <p class="lead text-muted mb-4">Good luck next time.</p>
            <div class="d-flex gap-3 justify-content-center">
                <button id="gameOverRetryBtn" class="btn btn-primary px-5">Re-Initiate Descent</button>
                <button id="gameOverBackBtn" class="btn btn-outline-light px-5">Abort to Base</button>
            </div>
        </div>
    </div>

    <script src="js/runnerGame.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
