<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Hub - Planet Hopper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Planet Hopper</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventory.html">Inventory</a></li>
                    <li class="nav-item"><a class="nav-link active" href="wellness.html">Challenges</a></li>
                    <li class="nav-item"><a class="nav-link" href="customize.html">Suit</a></li>
                    <li class="nav-item mx-2"><a class="btn btn-primary btn-sm px-4" href="planets.html">Play
                            Mission</a></li>
                    <li class="nav-item"><a class="nav-link text-danger ms-lg-3" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 animate-fade">
        <div class="row mb-5 align-items-end">
            <div class="col-md-8">
                <h1 class="display-4 fw-bold">Wellness Hub</h1>
                <p class="lead text-muted">Fuel your journey by completing challenges.</p>
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-primary px-4 py-2" data-bs-toggle="modal" data-bs-target="#createChallengeModal">
                    + New Community Challenge
                </button>
            </div>
        </div>

        <div id="alertPlaceholder"></div>

        <div class="row g-4" id="challengesContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Establishing uplink to Wellness Database...</p>
            </div>
        </div>
    </div>

    <!-- CREATE CHALLENGE MODAL -->
    <div class="modal fade" id="createChallengeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-panel border-0 text-white">
                <div class="modal-header border-0">
                    <h2 class="h5 modal-title fw-bold">Broadcast New Challenge</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createChallengeForm">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Title</label>
                            <input type="text" class="form-control" name="title" required
                                placeholder="e.g. Morning Nebula Stretch">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Description</label>
                            <textarea class="form-control" name="description" rows="3"
                                placeholder="Explain the objective..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label class="form-label small text-muted">Points Value</label>
                                <input type="number" class="form-control" name="points_value" value="20" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 mt-3">Publish Challenge</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- COMPLETE CHALLENGE MODAL -->
    <div class="modal fade" id="completeChallengeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-panel border-0 text-white">
                <div class="modal-header border-0">
                    <h2 class="h5 modal-title fw-bold">Log Mission Progress</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="text-muted" id="completeChallengeTitle"></p>
                    <form id="completeChallengeForm">
                        <div class="mb-4">
                            <label class="form-label small text-muted">Transmission Logs (Notes)</label>
                            <textarea class="form-control" id="completeNotes" rows="3"
                                placeholder="How was your performance?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-3">Submit Completion</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- VIEW LOGS MODAL -->
    <div class="modal fade" id="viewLogsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-panel border-0 text-white">
                <div class="modal-header border-0">
                    <h2 class="h5 modal-title fw-bold">Mission Completion Logs</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="logsContainer" class="row g-3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/wellness.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
