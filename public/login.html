<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Planet Hopper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center">

    <div class="container animate-fade col-12 col-md-8 col-lg-5 col-xl-4 mx-auto">
        <div class="glass-panel p-5 text-center">
            <h1 class="navbar-brand mb-2 d-block text-center fs-1">Planet Hopper</h1>
            <p class="text-muted mb-4">Reignite your journey across the stars</p>

            <div id="alertPlaceholder"></div>

            <form id="loginForm" class="text-start">
                <div class="mb-3">
                    <label class="form-label ms-2 small text-muted">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label ms-2 small text-muted">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 mb-3">Launch Session</button>
            </form>
            <button type="button" class="btn btn-outline-light w-100 py-3 mb-3" data-guest>Play as guest</button>

            <p class="mb-0 small text-muted">
                No account? <a href="register.html" class="text-accent text-decoration-none fw-bold">Create Account</a>
            </p>
        </div>
    </div>

    <script src="js/loginUser.js" type="module"></script>
    <script src="js/guest.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
